name: Build and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '留空构建试用包；填 vX.Y.Z 创建草稿 Release'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            qt_arch: clang_64
            qt_extra: ''
          - os: windows-2025
            platform: windows-x64
            qt_arch: win64_msvc2022_64
            qt_extra: '--external 7z'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
          # windows-2025 now ships VS 2026; select its installed VS 2022 (14.44) toolset.
          toolset: '14.44'
      - name: Prepare Qt extraction directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:RUNNER_WORKSPACE\Qt\6.12.0\msvc2022_64" | Out-Null
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.12.0'
          arch: ${{ matrix.qt_arch }}
          cache: 'true'
          # 3.3.0 cannot read Qt 6.11+ Windows repository paths; pin the upstream fix.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          extra: ${{ matrix.qt_extra }}
      - name: Version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          version=0.0.0
          tag="${REQUESTED_TAG:-}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vX.Y.Z'; exit 1; }
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configure
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == macOS ]]; then extra+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.2); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DPHOTOSCREEN_VERSION=${{ steps.version.outputs.version }} "${extra[@]}"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/macos-package.sh '${{ steps.version.outputs.version }}'
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows-package.ps1 -Version '${{ steps.version.outputs.version }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PhotoScreen-${{ matrix.platform }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  draft-release:
    if: (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: PhotoScreen-*
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Do not replace previously built artifacts.' >&2
            exit 1
          fi
          if existing_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null)"; then
            if [[ "$existing_commit" != "$GITHUB_SHA" ]]; then
              echo 'The requested tag points to a different commit.' >&2
              exit 1
            fi
          fi
          cd artifacts
          shopt -s nullglob
          installers=(*-setup.exe *.dmg)
          [[ ${#installers[@]} -eq 2 ]] || { echo 'Expected exactly one installer per platform.' >&2; exit 1; }
          sha256sum "${installers[@]}" > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "PhotoScreen $RELEASE_TAG" \
            --notes '请先在 Mac 和 Windows 实机安装验收，再发布此草稿。Mac 为 ad-hoc 签名，Windows 安装器未签名。' \
            "${installers[@]}" SHA256SUMS.txt
